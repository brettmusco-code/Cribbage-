# Cribbage sync server: one Durable Object per table holds the live game and
# that table's finished games, and a single Lobby object lists open tables.
# Runs on the Workers Free plan.
name = "cribbage-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "TABLES"
class_name = "Table"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
