# Cribbage sync server: one Durable Object per table holds the live game and
# that table's finished games. Runs on the Workers Free plan.
name = "cribbage-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "TABLES"
class_name = "Table"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table"]
